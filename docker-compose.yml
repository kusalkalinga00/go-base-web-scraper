services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-9000}:${PORT:-9000}"
    environment:
      - PORT=${PORT:-9000}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://scraper:scraper@postgres:5432/scraper?sslmode=disable
      - PDF_IMAGES_DIR=/data/pdf_images
      - CHROME_PATH=/usr/bin/chromium
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
      - PROXY_PROTOCOL=${PROXY_PROTOCOL:-http}
      - PROXY_MODE=${PROXY_MODE:-fallback}
      - MAX_WORKERS=${MAX_WORKERS:-3}
      - DIRECT_RETRIES=${DIRECT_RETRIES:-3}
      - PROXY_RETRIES=${PROXY_RETRIES:-2}
      - RETRY_DELAY_SECS=${RETRY_DELAY_SECS:-20}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - pdf_images:/data/pdf_images

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraper
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pdf_images:
  redis_data:
  pg_data:
